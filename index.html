<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Geometría Argentina</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.8.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #ayuda {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.75);
      color: white;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="ayuda">
    Apuntá la cámara a un marcador impreso.
  </div>

  <a-scene embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;">

    <a-assets>
      <!-- IMÁGENES 2D -->
      <img id="bandera" src="assets/bandera.png" crossorigin="anonymous">
      <img id="escudo" src="assets/escudo.png" crossorigin="anonymous">
      <img id="escarapela" src="assets/escarapela.png" crossorigin="anonymous">
      <img id="acta" src="assets/acta.png" crossorigin="anonymous">
      <img id="camiseta" src="assets/camiseta.png" crossorigin="anonymous">

      <!-- MODELOS 3D GLB -->
      <a-asset-item id="chupetin" src="assets/chupetin.glb"></a-asset-item>
      <a-asset-item id="cofre" src="assets/cofre.glb"></a-asset-item>
      <a-asset-item id="fubol" src="assets/fubol.glb"></a-asset-item>
      <a-asset-item id="mariposa" src="assets/mariposa.glb"></a-asset-item>
      <a-asset-item id="mariposa2" src="assets/mariposa2.glb"></a-asset-item>
    </a-assets>

    <!-- CÍRCULO → BANDERA -->
    <a-marker type="pattern" url="assets/pattern-circulo.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-image
        src="#bandera"
        position="0 0.05 0"
        rotation="-90 0 0"
        width="1.8"
        height="1.15"
        transparent="true">
      </a-image>
    </a-marker>

    <!-- TRIÁNGULO → ESCUDO -->
    <a-marker type="pattern" url="assets/pattern-triangulo.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-image
        src="#escudo"
        position="0 0.05 0"
        rotation="-90 0 0"
        width="1.25"
        height="1.25"
        transparent="true">
      </a-image>
    </a-marker>

    <!-- CUADRADO → ESCARAPELA -->
    <a-marker type="pattern" url="assets/pattern-cuadrado.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-image
        src="#escarapela"
        position="0 0.05 0"
        rotation="-90 0 0"
        width="1.25"
        height="1.25"
        transparent="true">
      </a-image>
    </a-marker>

    <!-- ROMBO → ACTA -->
    <a-marker type="pattern" url="assets/pattern-rombo.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-image
        src="#acta"
        position="0 0.08 0"
        rotation="-90 0 0"
        width="1.05"
        height="1.45"
        transparent="true">
      </a-image>
    </a-marker>

    <!-- HEXÁGONO → CAMISETA -->
    <a-marker type="pattern" url="assets/pattern-hexagono.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-image
        src="#camiseta"
        position="0 0.08 0"
        rotation="-90 0 0"
        width="1.15"
        height="1.35"
        transparent="true">
      </a-image>
    </a-marker>

    <!-- CHUPETÍN 3D -->
    <a-marker type="pattern" url="assets/pattern-chupetin.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-entity
        gltf-model="#chupetin"
        position="0 0 0"
        rotation="-90 0 0"
        scale="15 15 15">
      </a-entity>
    </a-marker>

    <!-- COFRE 3D -->
    <a-marker type="pattern" url="assets/pattern-cofre.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-entity
        gltf-model="#cofre"
        position="0 0 0"
        rotation="0 45 45"
        scale="1 1 1">
      </a-entity>
    </a-marker>

    <!-- FÚTBOL 3D -->
    <a-marker type="pattern" url="assets/pattern-futbol.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-entity
        gltf-model="#fubol"
        position="0 0 0"
        rotation="-90 0 0"
        scale="0.5 0.5 0.5">
      </a-entity>
    </a-marker>

    <!-- MARIPOSA 3D -->
    <a-marker type="pattern" url="assets/pattern-mariposa.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-entity
        gltf-model="#mariposa"
        position="0 0 0"
        rotation="0 90 90"
        scale="15 15 15">
      </a-entity>
    </a-marker>

    <!-- MARIPOSA 2 3D -->
    <a-marker type="pattern" url="assets/pattern-mariposa2.patt"
      smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">

      <a-entity
        gltf-model="#mariposa2"
        position="0 0 0"
        rotation="0 90 0"
        scale="2 2 2">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
